name: 릴리스

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 설정
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: 회귀 검사
        run: python3 -m unittest discover -s tests -v
      - name: 태그와 매니페스트 버전 확인
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("blender_manifest.toml").read_text(encoding="utf-8")
          )["version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"태그 {os.environ['RELEASE_TAG']}와 매니페스트 {version}이 일치하지 않습니다."
              )
          PY
      - name: Extension 패키지 생성
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_extension.py --output "dist/cat_tools-${RELEASE_TAG}.zip"
      - name: GitHub Release 생성
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/cat_tools-*.zip
