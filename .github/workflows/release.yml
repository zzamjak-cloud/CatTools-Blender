name: 릴리스

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: 회귀 검사
        run: python3 -m unittest discover -s tests -v
      - name: 태그와 매니페스트 버전 확인
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(
              Path("blender_manifest.toml").read_text(encoding="utf-8")
          )["version"]
          expected_tag = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"태그 {os.environ['RELEASE_TAG']}와 매니페스트 {version}이 일치하지 않습니다."
              )
          PY
      - name: Extension 패키지 생성
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_extension.py --output "dist/cat_tools-${RELEASE_TAG}.zip"
      - name: GitHub Release 생성
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/cat_tools-*.zip
